<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市级运营平台 - 订单管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="load-sidebar.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#60A5FA',
                        neutral: '#F3F4F6',
                        'neutral-dark': '#1F2937'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'primary': '0 4px 6px -1px rgba(30, 64, 175, 0.1), 0 2px 4px -1px rgba(30, 64, 175, 0.06)',
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)'
                    }
                }
            }
        }

        function toggleSubMenu(menuId) {
            const menu = document.getElementById(menuId);
            const arrow = document.getElementById(menuId + '-arrow');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                menu.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        // 通用模态框函数
        function showModal(title, content, buttons = [], size = 'max-w-2xl') {
            let modal = document.getElementById('modal');
            if (modal) modal.remove();
            
            modal = document.createElement('div');
            modal.id = 'modal';
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 transition-opacity duration-300';
            modal.style.opacity = '0';
            
            if (buttons.length === 0) {
                buttons = [{ text: '关闭', className: 'bg-gray-200 text-gray-800 hover:bg-gray-300 px-4 py-2 rounded-lg', action: 'close' }];
            }
            
            const buttonsHtml = buttons.map(btn => `
                <button class="${btn.className || 'bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90'}" data-action="${btn.action || 'custom'}">
                    ${btn.text}
                </button>
            `).join('');
            
            modal.innerHTML = `
                <div class="bg-white rounded-xl shadow-card border border-slate-200 ${size} w-full mx-4 overflow-hidden transform transition-all duration-300 scale-95 opacity-0" id="modal-container">
                    <div class="flex justify-between items-center border-b border-slate-200 p-4 bg-slate-50">
                        <h3 class="text-lg font-bold text-slate-900">${title}</h3>
                        <button id="closeModalIcon" class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-500">
                            <i class="fa fa-times"></i>
                        </button>
                    </div>
                    <div class="p-6 max-h-[70vh] overflow-y-auto">
                        ${content}
                    </div>
                    <div class="flex justify-end border-t border-slate-200 p-4 space-x-3 bg-slate-50">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            setTimeout(() => {
                modal.style.opacity = '1';
                const container = document.getElementById('modal-container');
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            function closeModal() {
                modal.style.opacity = '0';
                const container = document.getElementById('modal-container');
                container.classList.remove('scale-100', 'opacity-100');
                container.classList.add('scale-95', 'opacity-0');
                setTimeout(() => { if (modal.parentNode) modal.remove(); }, 300);
            }
            
            document.getElementById('closeModalIcon').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            
            modal.querySelectorAll('button').forEach((btn, index) => {
                btn.addEventListener('click', () => {
                    if (buttons[index]?.onClick) {
                        buttons[index].onClick();
                    } else if (buttons[index]?.action === 'close') {
                        closeModal();
                    }
                });
            });

            // Tab切换功能
            modal.querySelectorAll('[data-tab]').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetTab = tab.getAttribute('data-tab');
                    
                    // 移除所有tab的active状态
                    modal.querySelectorAll('[data-tab]').forEach(t => {
                        t.classList.remove('border-primary', 'text-primary');
                        t.classList.add('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
                    });
                    
                    // 添加当前tab的active状态
                    tab.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
                    tab.classList.add('border-primary', 'text-primary');
                    
                    // 隐藏所有tab内容
                    modal.querySelectorAll('.tab-pane').forEach(pane => {
                        pane.classList.remove('active');
                    });
                    
                    // 显示当前tab内容
                    const activePane = modal.querySelector(`#${targetTab}`);
                    if (activePane) {
                        activePane.classList.add('active');
                    }
                });
            });
        }

        // 通知函数
        function showNotification(message, type = 'info') {
            let notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 ${
                type === 'success' ? 'bg-green-500 text-white' : 
                type === 'error' ? 'bg-red-500 text-white' : 
                'bg-blue-500 text-white'
            }`;
            notification.innerHTML = `<i class="fa fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'times-circle' : 'info-circle'} mr-2"></i>${message}`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => { if (notification.parentNode) notification.remove(); }, 300);
            }, 3000);
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Tab切换样式 */
        .tab-content .tab-pane {
            display: none;
        }
        .tab-content .tab-pane.active {
            display: block;
        }
    </style>
</head>

    <!-- 主内容区 -->

        </header>

        <!-- 内容区 -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50">

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">

                    </div>

                            <option value="履约保函">履约保函</option>

                    <div>

                            <option value="审批不通过">审批不通过</option>
                            <option value="待支付">待支付</option>
                            <option value="已支付">已支付</option>
                            <option value="已出函">已出函</option>
                            <option value="退保中">退保中</option>
                            <option value="已退保">已退保</option>
                            <option value="拒绝退保">拒绝退保</option>
                            <option value="理赔中">理赔中</option>
                            <option value="已理赔">已理赔</option>

                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50 border-b">
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">

                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">订单编号</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">企业名称</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">项目名称</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">保函类型</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">金额(元)</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">承保机构</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">受益人</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">申请时间</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>

                        <tbody class="text-sm divide-y divide-slate-100" id="order-table-body">

    <script>
        // 模拟订单数据 - 全市订单
        const orderData = [
            { id: 'FJ202603110001', enterpriseName: '福建省建设工程有限公司', projectName: '福州市地铁2号线延伸工程', type: '投标保函', amount: '500,000.00', underwritingInstitution: '中国建设银行福建省分行', beneficiary: '福州市公共资源交易中心', applyTime: '2026-03-11 10:30:00', status: '已出函', operator: '张三' },
            { id: 'FJ202603250002', enterpriseName: '厦门市建筑工程集团', projectName: '厦门市翔安机场快速路工程', type: '投标保函', amount: '100,000.00', underwritingInstitution: '中国工商银行福建省分行', beneficiary: '厦门市公共资源交易中心', applyTime: '2026-03-25 14:20:00', status: '待支付', operator: '李四' },

            { id: 'FJ202604010004', enterpriseName: '漳州市城建集团', projectName: '漳州市城市轨道交通工程', type: '投标保函', amount: '200,000.00', underwritingInstitution: '中国建设银行福建省分行', beneficiary: '漳州市公共资源交易中心', applyTime: '2026-04-01 11:45:00', status: '申请中', operator: '赵六' },

            { id: 'FJ202604030006', enterpriseName: '宁德市水利工程公司', projectName: '宁德市水利枢纽工程', type: '预付款保函', amount: '800,000.00', underwritingInstitution: '中国银行福建省分行', beneficiary: '宁德市水利局', applyTime: '2026-04-03 10:00:00', status: '已取消', operator: '周八' },

        const tableBody = document.getElementById('order-table-body');
        let currentStatusFilter = '全部';

        function getStatusStyle(status) {
            switch(status) {
                case '申请中': return 'bg-blue-100 text-blue-700';
                case '已取消': return 'bg-gray-100 text-gray-600';
                case '审批不通过': return 'bg-red-100 text-red-700';

                case '已赔付': return 'bg-red-100 text-red-700';

            }
        }

            currentStatusFilter = status;

                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${item.enterpriseName}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${item.projectName}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${item.type}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-bold text-gray-900">¥${item.amount}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${item.underwritingInstitution}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${item.beneficiary}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-500">${item.applyTime}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusStyle(item.status)}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
