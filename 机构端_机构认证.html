    <script>
        // 营业期限：初始化默认值 + 长期勾选联动
        (function () {
            const startInput = document.getElementById('businessTermStart');
            const endInput = document.getElementById('businessTermEnd');
            const longCheck = document.getElementById('businessTermLong');
            if (document.getElementById('establishDate')) {
                document.getElementById('establishDate').value = '1998-01-01';
            }
            if (startInput) startInput.value = '1998-01-01';

            // 账户名称默认取机构名称，可修改
            const accountNameInput = document.getElementById('accountName');
            const institutionNameInput = document.getElementById('institutionName');
            if (accountNameInput) {
                accountNameInput.value = institutionNameInput ? institutionNameInput.value : '';
            }

            window.toggleBusinessTermLong = function () {
                if (!longCheck || !endInput) return;
                if (longCheck.checked) {
                    endInput.value = '';
                    endInput.disabled = true;
                    endInput.classList.add('bg-slate-100', 'text-slate-400');
                    endInput.placeholder = '长期';
                    endInput.removeAttribute('required');
                } else {
                    endInput.disabled = false;
                    endInput.classList.remove('bg-slate-100', 'text-slate-400');
                    endInput.placeholder = '';
                    if (!endInput.value) endInput.value = '2048-01-01';
                    endInput.setAttribute('required', '');
                }
            };

            if (longCheck) {
                longCheck.addEventListener('change', window.toggleBusinessTermLong);

            const requiredFields = document.querySelectorAll('input[required], select[required], textarea[required]');
            let isValid = true;
            
            requiredFields.forEach(field => {
                if (!field.value || field.value === '') {
                    isValid = false;
                    // 添加错误样式
                    field.classList.add('border-red-500');
                    field.classList.add('focus:ring-red-500');
                } else {
                    // 移除错误样式
                    field.classList.remove('border-red-500');
                    field.classList.remove('focus:ring-red-500');
                }
            });
            
            if (isValid) {
                alert('修改已保存');
            } else {
                alert('请填写所有必填字段');
            }
        });
