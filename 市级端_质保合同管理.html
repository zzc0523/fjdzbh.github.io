<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质保合同管理 - 市级运营端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="load-sidebar.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neutral-dark': '#1F2937'
                    }
                }
            }
        }

        function toggleSubMenu(menuId) {
            const menu = document.getElementById(menuId);
            const arrow = document.getElementById(menuId + '-arrow');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                menu.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <div class="w-64 bg-neutral-dark text-white flex flex-col shrink-0">
            <div class="p-6 border-b border-slate-700 flex items-center space-x-3">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center">
                    <i class="fa fa-building"></i>
                </div>
                <h1 class="text-sm font-bold tracking-tight">市级运营平台</h1>
            </div>
            <div id="sidebar-container"></div>
            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-800/50">
                    <div class="flex items-center">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" class="w-8 h-8 rounded-full" alt="Avatar">
                        <div class="ml-3">
                            <p class="text-xs font-bold">管理员</p>
                            <p class="text-[10px] text-slate-400">市级管理员</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-700 rounded-lg transition-all" title="退出登录">
                        <i class="fa fa-sign-out"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center px-8 shrink-0">
                <div class="flex items-center space-x-2">
                    <h2 class="text-lg font-bold text-slate-800">质保合同管理</h2>
                </div>
            </header>

            <!-- 内容区 -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100">
                        <div>
                            <h3 class="font-bold text-slate-800 mb-1">质保合同列表</h3>
                            <p class="text-sm text-slate-500">管理质保合同信息，支持新增、修改与批量导入</p>
                        </div>
                    </div>

                    <!-- 查询条件 -->
                    <div class="p-4 bg-slate-50 border-b border-slate-100">
                        <div class="flex flex-wrap items-center gap-4">
                            <div>
                                <label class="text-sm text-slate-600">合同名称：</label>
                                <input type="text" id="filterName" placeholder="请输入合同名称" class="ml-2 px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-44">
                            </div>
                            <div>
                                <label class="text-sm text-slate-600">合同甲方单位：</label>
                                <input type="text" id="filterParty" placeholder="请输入甲方单位" class="ml-2 px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-44">
                            </div>
                            <button onclick="searchData()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-all flex items-center">
                                <i class="fa fa-search mr-1"></i>查询
                            </button>
                            <button onclick="resetSearch()" class="px-4 py-2 bg-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-300 transition-all">
                                重置
                            </button>
                        </div>
                    </div>

                    <!-- 操作按钮区 -->
                    <div class="px-6 pt-4 pb-2 flex items-center space-x-3">
                        <button onclick="openAddModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-all flex items-center">
                            <i class="fa fa-plus mr-1"></i>新增
                        </button>
                        <button onclick="openImportModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-all flex items-center">
                            <i class="fa fa-upload mr-1"></i>批量导入
                        </button>
                    </div>

                    <!-- 数据表格 -->
                    <div class="p-6">
                        <div class="relative overflow-x-auto">
                            <table class="w-full min-w-[1400px]">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky-col" style="position: sticky; left: 0; background-color: #f8fafc; z-index: 2;">合同编号</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">合同名称</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">合同甲方单位</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">供应商</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">合同金额（元）</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">项目地址</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">合同起期</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">合同止期</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky-col" style="position: sticky; right: 0; background-color: #f8fafc;">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="contractTableBody" class="bg-white divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                        <!-- 分页 -->
                        <div id="contract-pagination" class="mt-6 flex justify-center"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 新增/修改弹窗 -->
    <div id="contractModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增质保合同</h3>
                <button onclick="closeContractModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
            </div>
            <div class="p-6 grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同编号 <span class="text-red-500">*</span></label>
                    <input id="f_code" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="如：HT202604150001">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同名称 <span class="text-red-500">*</span></label>
                    <input id="f_name" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="请输入合同名称">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同甲方单位（发包人） <span class="text-red-500">*</span></label>
                    <input id="f_party" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="请输入甲方单位名称">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同甲方企业名称 <span class="text-red-500">*</span></label>
                    <input id="f_partyName" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="请输入甲方企业名称">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同类型 <span class="text-red-500">*</span></label>
                    <select id="f_contractType" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">请选择</option>
                        <option value="工程类">工程类</option>
                        <option value="采购类">采购类</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">供应商 <span class="text-red-500">*</span></label>
                    <input id="f_supplier" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="请输入供应商名称">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同金额（元） <span class="text-red-500">*</span></label>
                    <input id="f_amount" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="如：5000000">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">保证金金额（元） <span class="text-red-500">*</span></label>
                    <input id="f_deposit" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="如：500000">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">保证金起始日期 <span class="text-red-500">*</span></label>
                    <input id="f_depositStart" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">保证金结束日期 <span class="text-red-500">*</span></label>
                    <input id="f_depositEnd" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">项目地址（省市区） <span class="text-red-500">*</span></label>
                    <input id="f_address" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="如：福建省福州市仓山区">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">项目详细地址 <span class="text-red-500">*</span></label>
                    <input id="f_addressDetail" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="请输入详细地址">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同起期 <span class="text-red-500">*</span></label>
                    <input id="f_start" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">合同止期 <span class="text-red-500">*</span></label>
                    <input id="f_end" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            <div class="flex justify-end space-x-3 px-6 py-4 border-t border-slate-100">
                <button onclick="closeContractModal()" class="px-5 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 transition-all">取消</button>
                <button onclick="saveContract()" class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-all">保存</button>
            </div>
        </div>
    </div>

    <!-- 批量导入弹窗 -->
    <div id="importModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800">批量导入质保合同</h3>
                <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
            </div>
            <div class="p-6">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm text-slate-500">请下载模板后按格式填写，再上传 Excel/CSV 文件</span>
                </div>
                <button onclick="downloadTemplate()" class="w-full mb-4 px-4 py-2 border border-dashed border-blue-300 text-blue-600 rounded-lg text-sm font-medium hover:bg-blue-50 transition-all flex items-center justify-center">
                    <i class="fa fa-download mr-1"></i>下载导入模板
                </button>
                <div class="border-2 border-dashed border-slate-200 rounded-lg p-6 text-center hover:border-blue-400 transition-colors cursor-pointer" id="importDropArea">
                    <i class="fa fa-cloud-upload text-3xl text-slate-300 mb-2"></i>
                    <p class="text-sm text-slate-400">点击或拖拽文件到此处上传</p>
                    <p class="text-[10px] text-slate-300 mt-1">支持 .xlsx / .csv，单文件 ≤ 10MB</p>
                    <input type="file" id="importFileInput" class="hidden" accept=".xlsx,.xls,.csv">
                </div>
                <ul id="importFileList" class="mt-3 space-y-1.5"></ul>
                <div id="importResult" class="mt-3 text-sm hidden"></div>
            </div>
            <div class="flex justify-end space-x-3 px-6 py-4 border-t border-slate-100">
                <button onclick="closeImportModal()" class="px-5 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 transition-all">取消</button>
                <button onclick="confirmImport()" class="px-5 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-all">开始导入</button>
            </div>
        </div>
    </div>

    <script>
        // --- 数据 ---
        let contracts = [
            { id: 1, code: 'HT20240527001', name: '福州市政道路改造质保合同', party: '福州市住房和城乡建设局', supplier: '福州建设发展有限公司', amount: '1,280,000', address: '福建省福州市鼓楼区', start: '2024-06-01', end: '2025-05-31' },
            { id: 2, code: 'HT20240528002', name: '宁德市污水处理厂扩容质保合同', party: '宁德市生态环境局', supplier: '福建水务集团', amount: '4,560,000', address: '福建省宁德市蕉城区', start: '2024-07-01', end: '2025-06-30' },
            { id: 3, code: 'HT20240601003', name: '厦门市政务云采购质保合同', party: '厦门市大数据管理局', supplier: '厦门智云科技', amount: '325,000', address: '福建省厦门市思明区', start: '2024-08-15', end: '2025-08-14' },
            { id: 4, code: 'HT20240603004', name: '泉州市公立医院物业质保合同', party: '泉州市卫生健康委员会', supplier: '泉州佳洁物业', amount: '890,000', address: '福建省泉州市丰泽区', start: '2024-09-01', end: '2026-08-31' },
            { id: 5, code: 'HT20240605005', name: '漳州市桥梁检测质保合同', party: '漳州市交通运输局', supplier: '漳州工程检测院', amount: '156,000', address: '福建省漳州市芗城区', start: '2024-10-01', end: '2025-09-30' },
            { id: 6, code: 'HT20240608006', name: '莆田市学校新建质保合同', party: '莆田市教育局', supplier: '莆田建工集团', amount: '3,340,000', address: '福建省莆田市城厢区', start: '2024-11-01', end: '2025-10-31' },
            { id: 7, code: 'HT20240610007', name: '龙岩市林业监测设备质保合同', party: '龙岩市林业局', supplier: '龙岩恒达电子', amount: '218,000', address: '福建省龙岩市新罗区', start: '2024-12-01', end: '2025-11-30' },
            { id: 8, code: 'HT20240612008', name: '三明市供水管网改造质保合同', party: '三明市住房和城乡建设局', supplier: '三明市政工程', amount: '2,770,000', address: '福建省三明市梅列区', start: '2025-01-01', end: '2025-12-31' }
        ];
        let nextId = 9;
        let currentEditId = null;
        let currentPage = 1;
        const PAGE_SIZE = 6;
        let filterName = '';
        let filterParty = '';
        let pendingImportRows = [];

        function getFiltered() {
            return contracts.filter(c => {
                const matchName = !filterName || c.name.toLowerCase().includes(filterName.toLowerCase());
                const matchParty = !filterParty || c.party.toLowerCase().includes(filterParty.toLowerCase());
                return matchName && matchParty;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('contractTableBody');
            const filtered = getFiltered();
            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageRows = filtered.slice(start, start + PAGE_SIZE);

            if (pageRows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="px-6 py-10 text-center text-sm text-slate-400">暂无数据</td></tr>`;
            } else {
                tbody.innerHTML = pageRows.map(c => `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 font-mono sticky-col" style="position: sticky; left: 0; background-color: #fff;">${c.code}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${c.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${c.party}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${c.supplier}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${c.amount}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${c.address}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 font-mono">${c.start}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 font-mono">${c.end}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-right sticky-col" style="position: sticky; right: 0; background-color: #fff;">
                            <div class="flex justify-end space-x-3">
                                <button onclick="openEditModal(${c.id})" class="text-blue-600 hover:text-blue-800 font-bold text-xs">修改</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const el = document.getElementById('contract-pagination');
            let html = '<div class="flex items-center justify-center space-x-2">';
            html += `<button class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})"><i class="fa fa-chevron-left"></i></button>`;
            for (let p = 1; p <= totalPages; p++) {
                html += `<button class="px-3.5 py-1.5 rounded-lg text-sm border ${p === currentPage ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}" onclick="goPage(${p})">${p}</button>`;
            }
            html += `<button class="px-3 py-1.5 rounded-lg text-sm border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed" ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})"><i class="fa fa-chevron-right"></i></button>`;
            html += '</div>';
            el.innerHTML = html;
        }

        window.goPage = function(page) {
            currentPage = page;
            renderTable();
        };

        function searchData() {
            filterName = document.getElementById('filterName').value.trim();
            filterParty = document.getElementById('filterParty').value.trim();
            currentPage = 1;
            renderTable();
        }

        function resetSearch() {
            document.getElementById('filterName').value = '';
            document.getElementById('filterParty').value = '';
            filterName = '';
            filterParty = '';
            currentPage = 1;
            renderTable();
        }

        // --- 新增 / 修改 ---
        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = '新增质保合同';
            ['f_code','f_name','f_party','f_partyName','f_contractType','f_supplier','f_amount','f_deposit','f_depositStart','f_depositEnd','f_address','f_addressDetail','f_start','f_end']
                .forEach(id => document.getElementById(id).value = '');
            document.getElementById('contractModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const c = contracts.find(x => x.id === id);
            if (!c) return;
            currentEditId = id;
            document.getElementById('modalTitle').textContent = '修改质保合同';
            document.getElementById('f_code').value = c.code;
            document.getElementById('f_name').value = c.name;
            document.getElementById('f_party').value = c.party;
            document.getElementById('f_partyName').value = c.partyName || '';
            document.getElementById('f_contractType').value = c.contractType || '';
            document.getElementById('f_supplier').value = c.supplier || '';
            document.getElementById('f_amount').value = c.amount;
            document.getElementById('f_deposit').value = c.deposit || '';
            document.getElementById('f_depositStart').value = c.depositStart || '';
            document.getElementById('f_depositEnd').value = c.depositEnd || '';
            document.getElementById('f_address').value = c.address || '';
            document.getElementById('f_addressDetail').value = c.addressDetail || '';
            document.getElementById('f_start').value = c.start;
            document.getElementById('f_end').value = c.end;
            document.getElementById('contractModal').classList.remove('hidden');
        }

        function closeContractModal() {
            document.getElementById('contractModal').classList.add('hidden');
        }

        function saveContract() {
            const required = [
                ['f_code','合同编号'], ['f_name','合同名称'], ['f_party','合同甲方单位'],
                ['f_partyName','合同甲方企业名称'], ['f_contractType','合同类型'],
                ['f_supplier','供应商'], ['f_amount','合同金额'], ['f_deposit','保证金金额'],
                ['f_depositStart','保证金起始日期'], ['f_depositEnd','保证金结束日期'],
                ['f_address','项目地址'], ['f_addressDetail','项目详细地址'],
                ['f_start','合同起期'], ['f_end','合同止期']
            ];
            for (const [id, label] of required) {
                if (!document.getElementById(id).value.trim()) {
                    showToast(`请填写${label}`, 'error');
                    return;
                }
            }
            const data = {
                code: document.getElementById('f_code').value.trim(),
                name: document.getElementById('f_name').value.trim(),
                party: document.getElementById('f_party').value.trim(),
                partyName: document.getElementById('f_partyName').value.trim(),
                contractType: document.getElementById('f_contractType').value,
                supplier: document.getElementById('f_supplier').value.trim(),
                amount: document.getElementById('f_amount').value.trim(),
                deposit: document.getElementById('f_deposit').value.trim(),
                depositStart: document.getElementById('f_depositStart').value.trim(),
                depositEnd: document.getElementById('f_depositEnd').value.trim(),
                address: document.getElementById('f_address').value.trim(),
                addressDetail: document.getElementById('f_addressDetail').value.trim(),
                start: document.getElementById('f_start').value.trim(),
                end: document.getElementById('f_end').value.trim()
            };
            if (currentEditId) {
                const c = contracts.find(x => x.id === currentEditId);
                Object.assign(c, data);
                showToast('修改成功', 'success');
            } else {
                data.id = nextId++;
                contracts.unshift(data);
                showToast('新增成功', 'success');
            }
            closeContractModal();
            currentPage = 1;
            renderTable();
        }

        // --- 批量导入 ---
        function openImportModal() {
            pendingImportRows = [];
            document.getElementById('importFileList').innerHTML = '';
            document.getElementById('importResult').classList.add('hidden');
            document.getElementById('importFileInput').value = '';
            document.getElementById('importModal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
        }

        function downloadTemplate() {
            const headers = ['合同编号','合同名称','合同甲方单位','合同甲方企业名称','合同类型','供应商','合同金额','保证金金额','保证金起始日期','保证金结束日期','项目地址（省市区）','项目详细地址','合同起期','合同止期'];
            const sample = ['HT202604150001','福州市地铁5号线延长线工程','福州市地铁集团有限公司','福州市地铁集团有限公司','工程类','福建省建设工程有限公司','5000000','500000','2026-04-15','2027-04-15','福建省福州市仓山区','福州市仓山区盖山镇地铁5号线延长线','2026-04-15','2026-10-15'];
            const csv = '﻿' + headers.join(',') + '\n' + sample.join(',');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '质保合同导入模板.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('模板已下载', 'success');
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) return [];
            const rows = lines.slice(1).map(line => {
                const cols = line.split(',');
                return {
                    code: (cols[0] || '').trim(),
                    name: (cols[1] || '').trim(),
                    party: (cols[2] || '').trim(),
                    partyName: (cols[3] || '').trim(),
                    contractType: (cols[4] || '').trim(),
                    supplier: (cols[5] || '').trim(),
                    amount: (cols[6] || '').trim(),
                    deposit: (cols[7] || '').trim(),
                    depositStart: (cols[8] || '').trim(),
                    depositEnd: (cols[9] || '').trim(),
                    address: (cols[10] || '').trim(),
                    addressDetail: (cols[11] || '').trim(),
                    start: (cols[12] || '').trim(),
                    end: (cols[13] || '').trim()
                };
            }).filter(r => r.code && r.name);
            return rows;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
            const drop = document.getElementById('importDropArea');
            const input = document.getElementById('importFileInput');
            drop.addEventListener('click', () => input.click());
            drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('border-blue-400','bg-blue-50'); });
            drop.addEventListener('dragleave', () => drop.classList.remove('border-blue-400','bg-blue-50'));
            drop.addEventListener('drop', e => {
                e.preventDefault();
                drop.classList.remove('border-blue-400','bg-blue-50');
                handleImportFiles(e.dataTransfer.files);
            });
            input.addEventListener('change', () => { handleImportFiles(input.files); input.value = ''; });
        });

        function handleImportFiles(files) {
            const list = document.getElementById('importFileList');
            const result = document.getElementById('importResult');
            result.classList.add('hidden');
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    const rows = parseCSV(e.target.result);
                    pendingImportRows = pendingImportRows.concat(rows);
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between p-2 border border-gray-100 rounded-md bg-gray-50 text-xs';
                    li.innerHTML = `<span class="truncate text-gray-700"><i class="fa fa-file-excel-o text-green-600 mr-1"></i>${file.name}</span><span class="text-gray-400 ml-2">解析 ${rows.length} 条</span>`;
                    list.appendChild(li);
                };
                reader.readAsText(file, 'UTF-8');
            });
        }

        function confirmImport() {
            if (pendingImportRows.length === 0) {
                showToast('请先上传文件', 'error');
                return;
            }
            const skip = pendingImportRows.filter(r => !r.code || !r.name || !r.party || !r.amount || !r.start || !r.end);
            pendingImportRows.forEach(r => {
                r.id = nextId++;
                contracts.unshift(r);
            });
            const total = pendingImportRows.length;
            const ok = total - skip.length;
            document.getElementById('importResult').innerHTML =
                `<div class="p-3 rounded-lg ${skip.length ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'} border ${skip.length ? 'border-amber-100' : 'border-emerald-100'}">` +
                `成功导入 <b>${ok}</b> 条${skip.length ? `，跳过 <b>${skip.length}</b> 条（必填项缺失）` : ''}。</div>`;
            document.getElementById('importResult').classList.remove('hidden');
            currentPage = 1;
            renderTable();
            pendingImportRows = [];
            setTimeout(closeImportModal, 1500);
            showToast(`导入完成，成功 ${ok} 条`, 'success');
        }

        // --- 轻量提示 ---
        function showToast(msg, type) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed top-4 right-4 z-[9999] space-y-2';
                document.body.appendChild(container);
            }
            const colors = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-700';
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-lg text-white text-sm shadow-lg ${colors} transition-all`;
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; }, 2000);
            setTimeout(() => t.remove(), 2400);
        }

        function logout() {
            alert('退出登录功能开发中...');
        }
    </script>
</body>
</html>
